<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="primefaces">

    <f:view contentType="text/html;charset=UTF-8" encoding="UTF-8">
        <h:head>
            <title>
                <ui:insert name="title-view">Sistema de Gimnasia Rítmica</ui:insert>
            </title>
            <ui:insert name="head"/>
            <link rel="preconnect" href="https://fonts.googleapis.com"/>
            <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&amp;display=swap" rel="stylesheet"/>
            <h:outputStylesheet library="css" name="theme.css"/>
            <style>
                button.ui-button {
                    margin-right: .5rem;
                }
                .app-container {
                    display: flex;
                    flex-direction: column;
                    min-height: 100vh;
                }
                .header-container {
                    padding: 0.6rem 1.25rem;
                }
                .header-content {
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                }
                .app-title {
                    display: flex;
                    align-items: center;
                    gap: 0.75rem;
                }
                .content-container {
                    flex: 1;
                    display: flex;
                    justify-content: center;
                    padding: 2rem;
                }
                .centered-card {
                    width: 95%;
                    max-width: 1200px;
                }
                .footer-content {
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    gap: 0.25rem;
                }
                .page-title {
                    display: flex;
                    align-items: center;
                    gap: 0.5rem;
                    margin-bottom: 1rem;
                }
                .metric-card {
                    text-align: center;
                }
            </style>
        </h:head>
        <h:body>
            <div class="app-container">
                <header id="header">
                    <div class="header-container">
                        <div class="header-content">
                            <div class="app-title">
                                                                <svg width="34" height="34" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" class="floating">
                                    <path d="M24 6C15 6 9 12 9 19c0 5 3 8 7 8s6-3 6-6-2-4-4-4-3 1.5-3 3"
                                          stroke="#f6a6cf" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                                    <path d="M24 6c9 0 15 6 15 13 0 5-3 8-7 8s-6-3-6-6 2-4 4-4 3 1.5 3 3"
                                          stroke="#b18fe0" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                                    <circle cx="24" cy="30" r="4" fill="#ffd6ea" stroke="#f6a6cf" stroke-width="1.5"/>
                                    <path d="M24 34c0 4-2 7-2 7" stroke="#b18fe0" stroke-width="2" stroke-linecap="round"/>
                                    <path d="M12 40l4-3M36 40l-4-3" stroke="#f6a6cf" stroke-width="2" stroke-linecap="round"/>
                                </svg>
                                <h:outputText value="Sistema de Gimnasia Rítmica"
                                              style="color: #5b4b72; font-weight: 700; font-size: 1.2rem; font-family: 'Quicksand', sans-serif"/>
                            </div>
                        </div>
                    </div>
                    <ui:insert name="menu">
                        <ui:include src="fragments/topbar.xhtml"/>
                    </ui:insert>
                </header>

                <main id="content">
                    <div class="content-container">
                        <div class="centered-card">
                            <ui:insert name="content">
                                <ui:debug hotkey="d"/>
                            </ui:insert>
                        </div>
                    </div>
                </main>

                <footer id="footer">
                    <ui:insert name="footer">
                        <ui:include src="fragments/footer.xhtml"/>
                    </ui:insert>
                </footer>

                <p:ajaxStatus style="width:32px;height:32px;position:fixed;right:7px;bottom:7px">
                    <f:facet name="start">
                        <i class="pi pi-spin pi-spinner layout-ajax-loader-icon" aria-hidden="true"/>
                    </f:facet>
                    <f:facet name="complete">
                        <h:outputText value=""/>
                    </f:facet>
                </p:ajaxStatus>
            </div>
        </h:body>
    </f:view>
</html>
